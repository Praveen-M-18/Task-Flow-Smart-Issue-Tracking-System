spring.application.name=taskflow-api
server.port=8085

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:taskflowdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=123

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration (HS256 requires key of at least 256 bits / 32 bytes)
app.jwt.secret=TaskFlowSmartIssueTrackingAppSecretKeyForJWTAuthTokenGeneration2026SecureKey!
app.jwt.expiration-milliseconds=86400000
